[package]
name = "cleaner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cleaner-core"
readme = "README.md"
description = "Fast, reusable disk scanning, sizing, and cleaning engine"
keywords = ["disk", "scanner", "cleaner", "filesystem", "fast"]
categories = ["filesystem", "command-line-utilities", "development-tools"]


[dependencies]
rayon = "1.12"
crossbeam-channel = "0.5"
foldhash = "0.2"
humansize = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
