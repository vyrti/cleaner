[package]
name = "cleaner-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cleaner-tui"
readme = "README.md"
description = "Fastest disk scanner and temporary file cleaner with interactive TUI"
keywords = ["tui", "ratatui", "disk-usage", "ncdu", "cleaner"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "cleaner_tui"
path = "src/lib.rs"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc"]
system-allocator = []

[dependencies]
cleaner-core.workspace = true
clap.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true
foldhash.workspace = true
indicatif.workspace = true
humansize.workspace = true
colored.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
ratatui.workspace = true
crossterm.workspace = true
libc.workspace = true
unicode-width.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { workspace = true, optional = true }


