[package]
name = "cleaner-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cleaner-tui"
readme = "README.md"
description = "Fastest disk scanner and temporary file cleaner with interactive TUI"
keywords = ["tui", "ratatui", "disk-usage", "ncdu", "cleaner"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "cleaner_tui"
path = "src/lib.rs"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc"]
system-allocator = []

[dependencies]
cleaner-core = { version = "0.1.0", path = "../cleaner-core" }
clap = { version = "4", features = ["derive"] }
rayon = "1.12"
crossbeam-channel = "0.5"
foldhash = "0.2"
indicatif = "0.18"
humansize = "2"
colored = "3"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
ratatui = "0.30"
crossterm = "0.29"
libc = "0.2"
unicode-width = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }

