[package]
name = "cleaner-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fastest disk scanner and cleaner"
publish = false

[lib]
name = "cleaner_tui"
path = "src/lib.rs"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc"]
system-allocator = []

[dependencies]
cleaner-core = { path = "../cleaner-core" }
clap = { version = "4", features = ["derive"] }
rayon = "1.12"
crossbeam-channel = "0.5"
foldhash = "0.2"
indicatif = "0.18"
humansize = "2"
colored = "3"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
ratatui = "0.30"
crossterm = "0.29"
libc = "0.2"
unicode-width = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
redb = "4.1.0"
objc2-core-foundation = { version = "0.3.2", features = ["std", "CFString", "CFArray", "CFRunLoop"] }
objc2-core-services = { version = "0.3.2", features = ["std", "libc", "FSEvents"] }
dispatch2 = "0.3.1"
