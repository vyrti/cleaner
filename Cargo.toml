[workspace]
members = [
    "crates/cleaner-core",
    "crates/cleaner-tui",
]
default-members = ["crates/cleaner-tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vyrti/cleaner"
homepage = "https://github.com/vyrti/cleaner"

[workspace.dependencies]
cleaner-core = { version = "0.1.0", path = "crates/cleaner-core" }
rayon = "1.12"
crossbeam-channel = "0.5"
foldhash = "0.2"
humansize = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
colored = "3"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
mimalloc = { version = "0.1", default-features = false }





[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.release.build-override]
opt-level = 3
