name: CI & Release

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Which part of the workflow to run'
        type: choice
        options:
          - test
          - release
          - docker
        required: true
        default: 'test'
      tag_name:
        description: 'Required for "release" or "docker" task: The tag for the action (e.g., v1.0.1)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: cleaner
  EXPECTED_VERSION: 0.1.0

jobs:
  # ===================================================================
  # Job 1: Fast Quality Gate (Format, Lint, Docs, Core Check)
  # ===================================================================
  quality_gate:
    name: Fast Quality Gate (fmt, clippy, docs)
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: quality-gate-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Doc-tests
        run: cargo test --doc --workspace --all-features

      - name: Check minimal cleaner-core
        run: cargo check -p cleaner-core --no-default-features

      - name: Check cleaner-core documentation
        run: cargo doc -p cleaner-core --all-features --no-deps

  # ===================================================================
  # Job 2: Multi-Platform Test Matrix
  # ===================================================================
  test_and_check:
    name: Test on ${{ matrix.target }}
    needs: quality_gate
    if: |
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'test')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            can_test: true

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            can_test: true

          - runner: macos-15
            target: x86_64-apple-darwin
            can_test: true

          - runner: macos-14
            target: aarch64-apple-darwin
            can_test: true

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            cross: true
            can_test: false

          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            can_test: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up QEMU
        if: matrix.cross == true
        uses: docker/setup-qemu-action@v3

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@cross

      - name: Build project
        run: |
          if [ "${{ matrix.cross }}" == "true" ]; then
            cross build --workspace --all-features --target ${{ matrix.target }}
          else
            cargo build --workspace --all-features --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Run tests (native)
        if: matrix.can_test == true && matrix.cross != true
        run: cargo test --workspace --all-features --target ${{ matrix.target }}

      - name: Run tests (cross / QEMU)
        if: matrix.can_test == true && matrix.cross == true
        run: cross test --workspace --all-features --target ${{ matrix.target }}

      - name: Smoke-test CLI version
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: test "$(cargo run -q -p cleaner-tui -- --version)" = "cleaner ${EXPECTED_VERSION}"

  # ===================================================================
  # Job 3: Build Release Artifacts
  # ===================================================================
  build_release_artifacts:
    name: Build release for ${{ matrix.target }}
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-arch: linux-x86_64
            asset_ext: .tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os-arch: windows-x86_64
            asset_ext: .zip
          - runner: macos-15
            target: x86_64-apple-darwin
            os-arch: macos-x86_64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os-arch: linux-arm64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            os-arch: linux-armv7
            asset_ext: .tar.gz
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            os-arch: windows-arm64
            asset_ext: .zip
          - runner: macos-14
            target: aarch64-apple-darwin
            os-arch: macos-arm64
            asset_ext: .tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            os-arch: freebsd-x86_64
            asset_ext: .tar.gz
            cross: true
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os-arch: linux-musl-x86_64
            asset_ext: .tar.gz
            cross: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            os-arch: linux-musl-arm64
            asset_ext: .tar.gz
            cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies for ARM cross-compile (Linux)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          fi

      - name: Configure cross-linker (Linux ARM)
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'armv7-unknown-linux-gnueabihf')
        run: |
          mkdir -p ~/.cargo
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          elif [ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]; then
            echo '[target.armv7-unknown-linux-gnueabihf]' >> ~/.cargo/config.toml
            echo 'linker = "arm-linux-gnueabihf-gcc"' >> ~/.cargo/config.toml
          fi

      - name: Set up QEMU
        if: matrix.cross == true
        uses: docker/setup-qemu-action@v3

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" == "true" ]; then
            cross build -p cleaner-tui --bin ${{ env.BINARY_NAME }} --release --target ${{ matrix.target }}
          else
            cargo build -p cleaner-tui --bin ${{ env.BINARY_NAME }} --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Smoke-test release CLI
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: test "$(target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} --version)" = "cleaner ${EXPECTED_VERSION}"

      - name: Package artifacts
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag_name }}" ]; then
              echo "Error: The 'tag_name' input is required when running the 'release' task."
              exit 1
            fi
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_TAG="${{ github.ref_name }}"
          fi
          echo "Packaging artifacts for version: $VERSION_TAG"
          BINARY_DIR="target/${{ matrix.target }}/release"
          ASSET_NAME="${{ env.BINARY_NAME }}-${VERSION_TAG}-${{ matrix.os-arch }}${{ matrix.asset_ext }}"
          mkdir -p dist_pkg
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp "$BINARY_DIR/${{ env.BINARY_NAME }}.exe" dist_pkg/
            cp README.md LICENSE-MIT LICENSE-APACHE dist_pkg/ || true
            powershell Compress-Archive -Path dist_pkg/* -DestinationPath "$ASSET_NAME"
            powershell "(Get-FileHash -Algorithm SHA256 '$ASSET_NAME').Hash.ToLowerInvariant() + '  $ASSET_NAME'" | tee "$ASSET_NAME.sha256"
          else
            cp "$BINARY_DIR/${{ env.BINARY_NAME }}" dist_pkg/
            cp README.md LICENSE-MIT LICENSE-APACHE dist_pkg/ || true
            tar -czf "$ASSET_NAME" -C dist_pkg .
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
            else
              shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
            fi
          fi

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.os-arch }}
          path: ${{ env.BINARY_NAME }}-*

  # ===================================================================
  # Job 4: Create GitHub Release
  # ===================================================================
  create_github_release:
    name: Create GitHub Release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'release')
    runs-on: ubuntu-latest
    needs: build_release_artifacts
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          draft: true
          files: release-artifacts/*/*

  # ===================================================================
  # Job 5: Build and Push Docker Image
  # ===================================================================
  build_and_push_docker:
    name: Build and Push Docker Image
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'docker')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.12.5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag_name }}" ]; then
              echo "Error: The 'tag_name' input is required when running the '${{ github.event.inputs.task_to_run }}' task manually."
              exit 1
            fi
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.BINARY_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.get_version.outputs.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.get_version.outputs.TAG }}
            type=semver,pattern={{major}},value=${{ steps.get_version.outputs.TAG }}
            type=raw,value=latest,enable=${{ startsWith(steps.get_version.outputs.TAG, 'v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
