name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Which part of the workflow to run'
        type: choice
        options:
          - test
        required: true
        default: 'test'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: cleaner
  EXPECTED_VERSION: 0.1.0

jobs:
  # ===================================================================
  # Job 1: Fast Quality Gate (Format, Lint, Docs, Minimal Core)
  # ===================================================================
  quality_gate:
    name: Fast Quality Gate (fmt, clippy, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: quality-gate-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Doc-tests
        run: cargo test --doc --workspace --all-features

      - name: Check minimal cleaner-core
        run: cargo check -p cleaner-core --no-default-features

      - name: Check cleaner-core documentation
        run: cargo doc -p cleaner-core --all-features --no-deps

  # ===================================================================
  # Job 2: Multi-Platform Test Matrix
  # ===================================================================
  test_and_check:
    name: Test on ${{ matrix.target }}
    needs: quality_gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            can_test: true

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            can_test: true

          - runner: macos-15
            target: x86_64-apple-darwin
            can_test: true

          - runner: macos-14
            target: aarch64-apple-darwin
            can_test: true

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true
            can_test: true

          - runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            cross: true
            can_test: false

          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            can_test: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up QEMU
        if: matrix.cross == true
        uses: docker/setup-qemu-action@v3

      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@cross

      - name: Build project
        run: |
          if [ "${{ matrix.cross }}" == "true" ]; then
            cross build --workspace --all-features --target ${{ matrix.target }}
          else
            cargo build --workspace --all-features --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Run tests (native)
        if: matrix.can_test == true && matrix.cross != true
        run: cargo test --workspace --all-features --target ${{ matrix.target }}

      - name: Run tests (cross / QEMU)
        if: matrix.can_test == true && matrix.cross == true
        run: cross test --workspace --all-features --target ${{ matrix.target }}

      - name: Smoke-test CLI version
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: test "$(cargo run -q -p cleaner-tui -- --version)" = "cleaner ${EXPECTED_VERSION}"
